[project]
name = "keybard"
version = "0.3.0a1"
description = "Cross-platform keyboard-only input library for Python terminals"
readme = "README.md"
keywords = ["keyboard", "input", "terminal", "console", "cli", "tui", "xterm", "ansi", "escape-sequences"]
authors = [
    { name = "Emasoft", email = "713559+Emasoft@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=14.2.0",
    "typing-extensions>=4.4.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[tool.uv_build]
include = [
    "assets/*",
    "examples/*",
]

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/Emasoft/KEYBARD"
Repository = "https://github.com/Emasoft/KEYBARD"
Issues = "https://github.com/Emasoft/KEYBARD/issues"
Changelog = "https://github.com/Emasoft/KEYBARD/blob/main/CHANGELOG.md"
Acknowledgments = "https://github.com/Emasoft/KEYBARD/blob/main/ACKNOWLEDGMENTS.md"


[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E741: Ambiguous variable name - disabled for color.py since 'l' (lightness) is standard in HSL color space
extend-ignore = []

[tool.ruff.lint.per-file-ignores]
"src/keybard/color.py" = ["E741"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "uv_build>=0.9.0,<0.10.0",
    "pytest>=8.4.2",
    "ruff>=0.8.0",
    "griffe==0.32.3",
    "httpx>=0.23.1",
    "mypy>=1.0.0",
    "pre-commit>=2.13.0",
    "pytest-xdist>=3.6.1",
    "pytest-asyncio",
    "pytest-cov>=5.0.0",
    "types-setuptools>=67.2.0.1",
    "isort>=5.13.2"
]
